<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>404 | Muram.exe ✨</title>
  <link rel="icon" type="image/png" href="/moon-favicon.png" />
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #0b0b18;
      color: #f4f0ff;
      font-family: system-ui, sans-serif;
      text-align: center;
    }

    main { max-width: 600px; }

    .moon {
      font-size: 3.5rem;
      color: #c7b8ff;
    }

    .label {
      color: #b8a4ff;
      letter-spacing: .2em;
      font-size: .8rem;
      font-weight: 700;
    }

    h1 {
      margin: 12px 0;
      font-size: clamp(6rem, 20vw, 10rem);
      line-height: 1;
      letter-spacing: -.08em;
    }

    h1 span { color: #a78bfa; }

    h2 { font-size: 1.6rem; }

    p {
      color: #b5b2c9;
      line-height: 1.8;
    }

    a {
      display: inline-block;
      margin-top: 18px;
      padding: 14px 22px;
      border-radius: 999px;
      background: #a78bfa;
      color: #171127;
      font-weight: 700;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 3px solid white;
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <main>
    <div class="moon" aria-hidden="true">☾</div>
    <p class="label">OOPS! WRONG UNIVERSE</p>
    <h1>4<span>0</span>4</h1>
    <h2>You've wandered into the void.</h2>
    <p>This page doesn't exist, or it may have moved to another corner of the internet.</p>
    <a href="/">← Take me home</a>
    <p>Muram.exe · Lost in space, not in code.</p>
  </main>
</body>
</html>
